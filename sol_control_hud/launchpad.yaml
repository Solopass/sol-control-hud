# The Projects and Media APIs cards: what can't be read from the project folders themselves.
#
# Everything else is discovered on each scan of `workspace`: the README title, first sentence and status words
# (deprecated / retired / finished / paused), the git remote (GitHub link), the last commit, uncommitted changes, and the
# dev-server command + port from `.claude/launch.json`. A new folder in the workspace shows up without an entry here.
#
# Optional per project: `autostart: true` = the HUD starts it once, ~15 s after the HUD itself starts, unless it
# already runs or its port is taken by something else.
#
# The dashboard only ever sends a *name*. Commands, paths and URLs come from this file (or the project's own
# launch.json), never from the page.

workspace: 'D:\Workspace'
editor: 'C:\Program Files\Microsoft VS Code\Code.exe'
wsl_distro: Ubuntu-24.04

# Folded away behind "show hidden" on the card (the value says why).
hidden:
  sol-hud: finished 2026-09-26, continued in sol-control-hud
  solar-station: retired 2026-09-13
  Textdiff: not needed on the HUD
  suno-manager: not needed on the HUD
  Ideas: notes, not a project

projects:
  sol-deck:
    title: SOL iPad Deck
    description: Ultra-fast iPad companion deck & Windows Win32 control server.
    # the script starts the exe hidden and detached (falls back to fallback\sol-deck.exe) and exits
    start: {cmd: ['powershell.exe', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'D:\Workspace\sol-deck\run-deck.ps1']}
    stop: {cmd: ['powershell.exe', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'D:\Workspace\sol-deck\run-deck.ps1', '-Stop']}
    port: 5000
    url: 'http://127.0.0.1:5000/deck'
    autostart: true                # started once after the HUD starts, if it isn't running and :5000 is free
  sol-cs2:
    title: SOL CS2
    description: Read-only CS2 HUD for the iPad (Game State Integration on :5010).
    start: {cmd: ['powershell.exe', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'D:\Workspace\sol-cs2\run.ps1']}
    stop: {cmd: ['powershell.exe', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'D:\Workspace\sol-cs2\run.ps1', '-Stop']}
    port: 5010
    url: 'http://127.0.0.1:5010/'
    autostart: true
  sol-control-hud:
    self: true                     # this app: no Start / Stop
    url: 'http://127.0.0.1:7900/'
  kiiy2k:
    title: KIIY2k Video FX
    description: 2000s WebGL cyber aesthetic video editor & timeline.
    # 5174, not vite's 5173: speed-reading and Polymatica already use 5173
    start: {cmd: [bun, run, dev, --, --host, '127.0.0.1', --port, '5174', --strictPort]}
    port: 5174
    url: 'http://127.0.0.1:5174/'
  VideoForge-1.0.0:
    title: VideoForge
    description: Private browser-based video converter and compressor (React, Vite, FFmpeg WebAssembly).
    start: {cmd: [bun, run, --cwd, videoforge, dev, --, --host, '127.0.0.1', --port, '5176', --strictPort]}
    port: 5176
    url: 'http://127.0.0.1:5176/'
  solang:
    start: {cmd: [bun, server.ts]}
    port: 3000
  edit-api:
    title: Edit Maker
    description: Clips + a song into a beat-synced vertical kpop edit (beat cuts, speed ramps, glitch, lyric captions).
    # the project's own venv Python, so no `uv` is needed on the HUD's PATH; it serves the page and API on 127.0.0.1 only
    start: {cmd: ['D:\Workspace\edit-api\.venv\Scripts\python.exe', -m, edit_api, serve]}
    port: 8090
    url: 'http://127.0.0.1:8090/'
  pokepalace:
    title: PokéPalace
    description: 3D voxel Pokémon memory palace and habit sim.
    start: {cmd: [bun, run, dev]}
    port: 5195
    url: 'http://127.0.0.1:5195/'
  sol-loci:
    title: SOL Loci
    description: 3D world and memory palace with live screens, a library of your notes, and flashcards on loci.
    # the script builds if needed, starts the exe hidden and detached, opens an Edge window and exits;
    # the server stops itself 2 minutes after its last window closes, so there is no Stop and no autostart
    start: {cmd: ['powershell.exe', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'D:\Workspace\sol-loci\launch.ps1']}
    port: 5197
    url: 'http://127.0.0.1:5197/'
  gatkam:
    title: GatKam (갓캠)
    description: Next-gen YouTube Studio Suite & Unified Camera Engine (PTZ + Autopilot + Telemetry).
    start: {cmd: [bun, run, dev]}
    watcher: true
    sidecars:
      # its own ▶/■ button on the row; loopback only, writes D:\Workspace\gatkam\logs\*.jsonl (lag flight recorder)
      logger: {title: Lag Logger, cmd: [bun, run, logger], port: 7917}
  youtube-alchemy:
    title: YouTube Alchemy
    description: 1-Click Userscript installer & Fancam / Local AI Vault Server.
    start: {cmd: [bun, serve-install.mjs]}
    port: 8788
    url: 'http://127.0.0.1:8788/'
  solopass-v1:
    live: 'https://solopass.github.io/solopass-v1/'
  Polymatica:
    live: 'https://polymatica.pages.dev'
  WWenigma:
    open_file: wwii_cryptography_3d_lab.html     # a standalone build: no server needed
  omni-tools:
    title: OmniTools
    description: Self-hosted browser tools for images, video, audio, PDFs and text (a fork of iib0011/omni-tools).
    # its node_modules are Linux builds (esbuild/swc linux-x64), so it runs in WSL
    # a production build served with `vite preview` (starts in ~2 s; rebuilds only after its code changed, ~1.5 min)
    start: {wsl: 'exec bash /mnt/d/Workspace/sol-control-hud/scripts/omni-tools-serve.sh'}
    stop: {wsl: 'pkill -f /mnt/d/Workspace/omni-tools/node_modules'}
    port: 8082
    runs_in: wsl
  media-api: {media: media-api}
  speedman: {media: speedman}
  voice-savior: {media: voice-savior}
  lossless-cut: {media: lossless-cut}


# Media services. `runs_in: wsl` ones sit behind systemd socket activation: a request *starts* them, so the card never
# sends one unless the service is already running (checked inside WSL in the same call, see media_apis.py).
media:
  media-api:
    title: SOL Media Studio
    what: download, clip, transcribe, Obsidian notes
    project: media-api
    port: 8080
    runs_in: wsl
    unit: media-api
    start: {shortcut: 'D:\Workspace\media-api\Media-Studio-Silent.vbs'}
    docs: /docs
    health: /api/v1/health         # only on "Live" (a request during its ~1 s shutdown would start it again)
    jobs: /api/v1/jobs             # only on "Live" (it counts as activity and postpones the idle shutdown)
    shutdown: /api/v1/shutdown     # refuses while jobs run
    jobs_file: 'D:\AI\Cache\media_jobs.json'
    notes_dir: 'D:\AI\Vault\Transcripts'
    folder: 'D:\Output'
  speedman:
    title: Speedman
    what: sped-up speech that stays clear
    project: speedman
    port: 8081
    runs_in: wsl
    unit: speedman
    start: {shortcut: 'D:\Workspace\speedman\Speedman-Silent.vbs'}
    docs: /docs
    # not /health: it pings media-api, which would wake that one up
    jobs: /api/v1/jobs
    shutdown: /api/v1/shutdown     # doesn't check for running jobs itself: the HUD asks /api/v1/jobs first
    folder: 'D:\Audio\Speed'
  voice-savior:
    title: Vocal Savior
    what: tuned, mixed vocals from a raw take
    project: voice-savior
    port: 8765
    runs_in: windows
    match: vocal_savior            # the listener's command line, to tell it from anything else on :8765
    start: {cmd: ['D:\Workspace\voice-savior\.venv\Scripts\pythonw.exe', -m, vocal_savior, app], opens_itself: true}
    # not /health: it pings media-api and speedman
    jobs: /api/jobs?limit=5
    shutdown: /api/shutdown
    jobs_db: 'D:\Audio\Vocals\jobs.sqlite'
    folder: 'D:\Audio\Vocals\Finished'
  omni-tools:
    title: OmniTools
    what: video, audio, image and PDF tools in the browser
    project: omni-tools            # started and stopped as the project
    port: 8082
    runs_in: wsl
  lossless-cut:
    title: LosslessCut
    what: lossless video and audio trimming and stream cutting
    project: lossless-cut
    runs_in: windows
    start: {shortcut: 'D:\Workspace\lossless-cut\LosslessCut.lnk'}
    folder: 'D:\Output'
  kiiy2k:
    title: KIIY2k Video FX
    what: 2000s WebGL cyber aesthetic video editor
    project: kiiy2k
    port: 5174
    runs_in: windows
    url: 'http://127.0.0.1:5174/'
    folder: 'D:\Output\Videos'
  edit-api:
    title: Edit Maker
    what: clips + a song into a beat-synced vertical edit
    project: edit-api              # started and stopped as the project
    port: 8090
    runs_in: windows
    url: 'http://127.0.0.1:8090/'
    folder: 'D:\Workspace\edit-api\projects'
  youtube-alchemy:
    title: YouTube Alchemy
    what: 1-click userscripts, fancam slice & vault server
    project: youtube-alchemy
    port: 8788
    runs_in: windows
    url: 'http://127.0.0.1:8788/'
    folder: 'D:\Output\Videos\Edits'

