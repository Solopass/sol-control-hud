# Runbook step 10: recording or URL -> transcript (media-api, parakeet) -> summary (sol-fast) -> Obsidian note.
# Run: .\.venv\Scripts\python.exe -m sol_hud.pipelines note <file-or-url> [--title "..."]
name: transcript-note
fallback: true                  # in Desk mode sol-specialist -> sol-smart (as the old translator did)
inputs: [source, title, engine, language]
steps:
  - id: transcribe
    tool: transcribe
    args:
      source: "{{ inputs.source }}"
      title: "{{ inputs.title }}"     # empty = the video title, or the file name
      engine: "{{ inputs.engine }}"
      language: "{{ inputs.language }}"

  - id: summary
    model: sol-fast               # Gemma 4 12B, 32k context
    long_model: sol-long          # gpt-oss-20b at 65k: loaded only when the transcript is too long for sol-fast
    escalate_to: sol-specialist   # Away: Qwen3.8-27B; Desk: sol-smart. Used only if sol-fast fails twice
    retries: 2
    max_tokens: 8192
    # Instructions first and transcript last, so the prompt prefix stays the same between runs.
    prompt: |
      You turn a transcript into structured notes. Use only what the transcript says; never add facts,
      names, numbers or dates that are not in it. Keep names, amounts and dates exactly as transcribed.

      - overview: 2-4 sentences on what the recording is about and its outcome.
      - key_points: the most important points in order, 3-8 for longer recordings (fewer only if the
        recording is very short). Summarize; don't copy every sentence. "at" = where the point is made,
        written like 00:01:05 (no brackets).
      - action_items: tasks someone committed to or was asked to do. owner = the person named, or "unknown".
        due = the deadline in the transcript's own words (e.g. "March 1", "Friday afternoon"), or "none".
        Never put a timestamp or an invented time in due. Empty list if there are none.
      - decisions: things that were agreed or decided. Empty list if none.
      - dates: every date or deadline mentioned, with what it is for.
      - people: names of people mentioned.

      Title: {{ steps.transcribe.output.title }}
      Transcript (timestamps in [HH:MM:SS]):
      {{ steps.transcribe.output.timestamped_text }}
    schema:
      type: object
      additionalProperties: false
      required: [overview, key_points, action_items, decisions, dates, people]
      properties:
        overview: {type: string}
        key_points:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [point, at]
            properties:
              point: {type: string}
              at: {type: string, pattern: "^\\d{2}:\\d{2}:\\d{2}$"}
        action_items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [task, owner, due]
            properties:
              task: {type: string}
              owner: {type: string}
              due: {type: string}
        decisions: {type: array, items: {type: string}}
        dates:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [date, what]
            properties:
              date: {type: string}
              what: {type: string}
        people: {type: array, items: {type: string}}
    checks:
      - {path: overview, min_length: 40}
      - {path: key_points, min_items: 1, max_items: 8}

  - id: note
    tool: write_note
    args:
      transcription: "{{ steps.transcribe.output }}"
      summary: "{{ steps.summary.output }}"
      summary_model: sol-fast
