# Example chain (phase 1 end-to-end test): every note in a folder -> 1-line summary -> one index note.
# Run: .\.venv\Scripts\python.exe -m sol_hud.pipelines run workflows\examples\summarize-folder.yaml --input "folder=D:\Polymatica Vault\2026" --input "glob=2026-09-1*.md" --input "out=D:\Output\chains"
name: summarize-folder
inputs: [folder, glob, out]
system: You summarize personal notes accurately and briefly. Use only what the note says.
steps:
  - id: files
    tool: list_files
    args: {folder: "{{ inputs.folder }}", glob: "{{ inputs.glob }}", recursive: false, chunk_tokens: 20000}

  - id: each
    for_each: {items: "{{ steps.files.output }}", as: file}
    continue_on_error: true
    model: sol-fast
    reasoning: off
    max_tokens: 400
    prompt: |
      One sentence (max 25 words) saying what this note is about.
      Note "{{ file.name }}":
      {{ file.text }}
    checks:
      - {path: "", min_length: 10}

  - id: index
    model: sol-fast
    max_tokens: 3000
    prompt: |
      Here are one-line summaries of notes, in order. Write a short paragraph (3-5 sentences) about the themes
      across them. Then stop.
      {{ steps.each.output }}

  - id: save
    tool: save_note
    args:
      folder: "{{ inputs.out }}"
      name: "Summary test"
      text: "{{ steps.index.output }}"
